name: Source checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --check handler.js && node --check lib/imported-compat.js && node --check plugins/economy/xp-register.js
      - run: node --test tests/auto-ai.test.mjs tests/agent-settings.test.mjs tests/imported-compat.test.mjs
      - run: node --loader ./tests/mock-native-loader.mjs --test tests/native-dispatch.test.mjs
